<style>
:root{--bg:#fbfaf7;--paper:#fff;--ink:#24221e;--muted:#8c877e;--line:#e8e4db;--rule:#d6d1c6;--accent:#c4703a;--hover:#f1eee7;--check:#4a8a64;--soft:#f6f1e9;--we:#f7f4ee;--c1:#6f8f74;--c2:#c4703a;--c3:#5b7fa6;--c4:#9a6a93;--c5:#b8963a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171614;--paper:#201f1c;--ink:#e9e5dc;--muted:#8f897e;--line:#2f2c27;--rule:#45413a;--accent:#e08a50;--hover:#26241f;--check:#6fb48a;--soft:#24211c;--we:#1b1a17;--c1:#86ad8c;--c2:#e08a50;--c3:#7fa3cc;--c4:#bf8ab7;--c5:#d4b057;color-scheme:dark}}
:root[data-theme=dark]{--bg:#171614;--paper:#201f1c;--ink:#e9e5dc;--muted:#8f897e;--line:#2f2c27;--rule:#45413a;--accent:#e08a50;--hover:#26241f;--check:#6fb48a;--soft:#24211c;--we:#1b1a17;--c1:#86ad8c;--c2:#e08a50;--c3:#7fa3cc;--c4:#bf8ab7;--c5:#d4b057;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}

/* app shell: calendar, account and theme */
#appBar{flex:none;display:flex;align-items:center;gap:10px;padding:8px max(12px, env(safe-area-inset-left, 0px));border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:6}
#appName{font-size:15px;font-weight:600;padding:0 6px}
#appBar .grow{flex:1}
#appCal{flex:1;min-height:0;overflow:auto}
#acct{color:var(--muted);padding:5px 10px;border-radius:8px;font-size:13.5px;display:flex;align-items:center;gap:6px}
#acct:hover{background:var(--hover);color:var(--ink)}
#acct[hidden]{display:none}
#login{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;padding:16px}
#login[hidden]{display:none}
html.locked #appBar,html.locked #appCal{display:none!important}
html.locked #login{background:var(--bg)}
html.locked #lgCancel{display:none}
#cstatus{display:none!important}
.lg{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;box-shadow:0 16px 48px rgba(0,0,0,.2)}
.lg h2{margin:0 0 2px;font-size:19px}
.lg p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
.lg input{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;outline:none;font-size:15px}
.lg input:focus{border-color:var(--accent)}
.lg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.lg button{padding:8px 16px;border-radius:9px;font-size:14px}
.lg .pri{background:var(--accent);color:#fff}
.lg .sec2{color:var(--muted)}.lg .sec2:hover{background:var(--hover)}
.lg .err{color:#b4443a;font-size:13px;min-height:1em}
/* ===== calendar ===== */
.app{display:grid;grid-template-columns:minmax(0,1fr) 370px;height:100%}
.panel{min-width:0}
.cal{display:flex;flex-direction:column;min-width:0;height:100%;padding:18px 24px 20px}
.head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
#mtitle{font-size:26px;font-weight:650;letter-spacing:-.01em;margin:0 10px 0 0;min-width:0}
#mtitle span{color:var(--muted);font-weight:400}
.nb{height:30px;min-width:30px;padding:0 10px;border-radius:8px;color:var(--muted);font-size:14px}
.nb:hover{background:var(--hover);color:var(--ink)}
.nb.arrow{font-size:18px;padding:0 8px}
.head .sp{flex:1}
#cstatus{font-size:12px;color:var(--muted);white-space:nowrap}

.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;color:var(--muted);padding:0 0 6px;letter-spacing:.04em;text-transform:uppercase}
.wd div{padding-left:8px}
.grid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(var(--rows,5),minmax(92px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px 4px;min-width:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative;background:var(--bg);outline:none}
.day.we{background:var(--we)}
.day:hover{background:var(--hover)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.day.out .num,.day.out .chip{opacity:.4}
.num{font-size:13px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums;flex:none}
.day.today .num{background:var(--accent);color:#fff;font-weight:600}
.dn{position:absolute;top:8px;right:8px;width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.6}
.chip{display:flex;gap:5px;align-items:center;font-size:12.5px;line-height:1.35;white-space:nowrap;overflow:hidden;min-width:0;padding:1px 4px;border-radius:4px;background:color-mix(in srgb,var(--cc) 12%,transparent)}
.chip::before{content:"";width:3px;align-self:stretch;border-radius:2px;background:var(--cc);flex:none}
.chip b{font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted)}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip.done span{text-decoration:line-through;color:var(--muted)}
.more{font-size:12px;color:var(--muted);padding-left:4px}
.c1{--cc:var(--c1)}.c2{--cc:var(--c2)}.c3{--cc:var(--c3)}.c4{--cc:var(--c4)}.c5{--cc:var(--c5)}

/* day panel */
.panel{border-left:1px solid var(--line);height:100%;overflow:auto;padding:22px 20px 40px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
#dtitle{font-size:20px;font-weight:650;margin:0;letter-spacing:-.005em}
.dsub{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.quick{display:flex;gap:6px}
#quick{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 11px;outline:none;font-size:14.5px}
#quick:focus{border-color:var(--rule)}
#addBtn{border-radius:9px;padding:0 12px;background:var(--hover);color:var(--ink);font-size:20px;line-height:1}
#addBtn:hover{background:var(--line)}
#clist{display:flex;flex-direction:column}
.empty{color:var(--muted);font-size:14px;padding:6px 0 4px;line-height:1.5}
.ev{display:flex;gap:10px;align-items:flex-start;padding:9px 2px 9px 10px;border-bottom:1px solid var(--line);position:relative}
.ev::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--cc)}
.ev input[type=checkbox]{appearance:none;-webkit-appearance:none;width:17px;height:17px;border:1.5px solid var(--muted);border-radius:5px;margin:2px 0 0;flex:none;cursor:pointer;display:grid;place-content:center;background:var(--paper)}
.ev input:checked{background:var(--check);border-color:var(--check)}
.ev input:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.evm{flex:1;min-width:0;cursor:pointer}
.evt{display:flex;gap:8px;align-items:baseline}
.tm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tt{font-weight:500;overflow-wrap:anywhere}
.tt:empty::before{content:"Без названия";color:var(--muted);font-weight:400}
.rp{font-size:12px;color:var(--muted)}
.nt{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:1px}
.ev.done .tt{text-decoration:line-through;color:var(--muted)}
.ev.open{background:var(--soft);border-bottom-color:transparent;border-radius:8px 8px 0 0}

.editor{background:var(--soft);border-radius:0 0 8px 8px;padding:4px 12px 12px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--line);margin-bottom:2px}
.editor input[type=text],.editor textarea,.editor select,.editor input[type=time]{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 9px;outline:none;font-size:14px;min-width:0}
.editor input:focus,.editor textarea:focus,.editor select:focus{border-color:var(--rule)}
.editor .f-title{font-weight:500;font-size:15px}
.editor textarea{resize:none;min-height:64px;line-height:1.45}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.frow input[type=time]{width:auto;font-variant-numeric:tabular-nums}
.csw{width:20px;height:20px;border-radius:50%;background:var(--cc);border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
.csw.on{border-color:var(--paper);box-shadow:0 0 0 2px var(--cc)}
.eact{display:flex;gap:4px;flex-wrap:wrap}
.eact button{font-size:13px;padding:5px 10px;border-radius:7px;color:var(--muted)}
.eact button:hover{background:var(--line);color:var(--ink)}
.eact .ok{background:var(--ink);color:var(--bg)}
.eact .ok:hover{background:var(--ink);color:var(--bg);opacity:.85}
.eact .del{margin-left:auto}
.eact .del.armed{background:#b4443a;color:#fff}

.qopts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:-4px}
.qcol{display:flex;gap:6px;flex-wrap:wrap}
.qcol .csw{width:16px;height:16px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.pill:hover{color:var(--ink)}
.pill.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--ink)}
.qtime{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.qtime[hidden],.f-tw[hidden]{display:none}
.qtime input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 6px;outline:none;font-size:13px;font-variant-numeric:tabular-nums;color-scheme:dark}
.qtime input:focus{border-color:var(--rule)}
.f-tw{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 6px}
#daynote{width:100%;border:0;border-top:1px dashed var(--line);background:transparent;outline:none;resize:none;padding:8px 0;min-height:70px;line-height:1.55;font-size:14.5px}
#daynote::placeholder{color:var(--rule)}
.up{display:flex;gap:10px;padding:5px 0;font-size:13.5px;cursor:pointer;border-radius:6px;align-items:baseline}
.up:hover{color:var(--accent)}
.up .ud{color:var(--muted);width:62px;flex:none;font-variant-numeric:tabular-nums}
.up .ut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.up .ut b{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;display:inline-block;width:46px}
.ckeys{font-size:12px;color:var(--muted);line-height:1.8;margin-top:auto;padding-top:10px}
.ckeys kbd{font:inherit;font-size:11px;background:var(--hover);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink)}

@media (max-width:900px){
  .app{display:block;height:auto}
  .cal{height:auto;padding:14px 16px 8px}
  .grid{grid-template-rows:repeat(var(--rows,5),minmax(58px,auto))}
  .panel{border-left:0;border-top:1px solid var(--line);height:auto;overflow:visible;padding:18px 16px 40px}
  .ckeys{display:none}
}
@media (max-width:600px){
  #mtitle{font-size:21px;width:100%;margin:0 0 2px}
  .wd div{padding-left:0;text-align:center}
  .day{padding:4px 2px;align-items:center}
  .num{font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;padding:0 2px}
  .chip{width:6px;height:6px;padding:0;border-radius:50%;background:var(--cc)}
  .chip::before,.chip b,.chip span{display:none}
  .chip.done{opacity:.35}
  .more{display:none}
  .dn{top:5px;right:5px}
}
@media (min-width:601px){.chips{display:flex;flex-direction:column;gap:2px;min-width:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== redesign: Cron-like dark theme ===== */
:root:root:root{--bg:#0f0d0a;--paper:#161412;--ink:#ffffff;--body:#cccccc;--muted:#8a857e;--line:#221f1b;--rule:#34302a;--accent:#ff4700;--hover:#1a1714;--check:#ff4700;--soft:#161412;--we:#0c0a08;
  --glow:0 0 0 1px #451e0e,0 0 24px 4px #8b2e09;
  --c1:#ff4700;--c2:#cccccc;--c3:#7f93a8;--c4:#b08d6a;--c5:#7d9a7f;color-scheme:dark;
  --font:"Helvetica Neue",Inter,"Neue Haas Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{font-family:var(--font);color:var(--body);font-size:15px}
#mtitle,#dtitle,.tt,.lg h2{color:var(--ink)}
/* app header */
#appBar{padding-top:10px;padding-bottom:10px}


/* big type */
#mtitle{font-size:clamp(34px,5vw,64px);font-weight:700;letter-spacing:-.021em;line-height:.9}
#mtitle span{color:var(--muted);font-weight:700}

#dtitle{font-size:22px;font-weight:500;line-height:1.1}
.wd{font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
/* calendar grid: sharp, tonal */
.grid{border-color:var(--line)}
.day{border-color:var(--line);background:var(--bg)}
.day.we{background:var(--we)}
.day:hover{background:var(--hover)}
.day.sel{box-shadow:inset 0 0 0 1px var(--accent)}
.num{color:var(--body)}
.day.today .num{background:var(--accent);color:#fff;font-weight:700}
.chip{border-radius:4px;background:var(--paper);color:var(--body)}
.chip::before{width:2px}
.nb{border-radius:9999px}
.nb:hover{background:var(--paper)}
/* day panel */
.panel{border-color:var(--line);background:var(--bg)}
#quick,.editor input[type=text],.editor textarea,.editor select,.editor input[type=time],#search,.lg input{background:var(--paper);border:1px solid var(--line);border-radius:4px;color:var(--ink)}
#quick:focus,#search:focus,.lg input:focus,.editor input:focus,.editor textarea:focus{border-color:var(--accent)}
#addBtn{background:var(--accent);color:#fff;border-radius:4px}
#addBtn:hover{background:var(--accent);filter:brightness(1.08)}
.ev{border-color:var(--line)}
.ev input[type=checkbox],.b-check input{background:transparent;border-color:#5a554e;border-radius:4px}
.ev.open{background:var(--paper);border-radius:0}
.editor{background:var(--paper);border-radius:0;border-color:var(--line)}
.eact .ok,.lg .pri{background:var(--accent);color:#fff;border-radius:4px;box-shadow:var(--glow)}
.eact .ok:hover{background:var(--accent);color:#fff}
.eact button{border-radius:4px}
.sec h3{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:500}
#daynote{border-color:var(--line);color:var(--body)}
.csw{box-shadow:0 0 0 1px var(--rule)}

aside{background:var(--bg);border-color:var(--line)}
.ni{border-radius:4px}
.ni.on{background:var(--paper);box-shadow:inset 2px 0 0 var(--accent)}
.bar{background:color-mix(in srgb,var(--bg) 92%,transparent);border-color:var(--line)}
.tb{border-radius:9999px}
.tb:hover{background:var(--paper)}
.b-quote{background:var(--paper);border-left-color:var(--accent);border-radius:0}
.b-h .ed{color:var(--ink);font-size:22px;font-weight:500}
.ed{color:var(--body)}
table{border-radius:0;border-color:var(--rule)}
tr:first-child td{background:var(--paper);color:var(--ink)}
.dot{background:var(--accent)}
.hr::before{background:var(--rule)}
.keys kbd,.ckeys kbd{background:var(--paper);border-color:var(--line);color:var(--body)}
.lg{background:var(--paper);border-radius:4px;box-shadow:none;border-color:var(--rule)}
.add{border-radius:9999px}
#cstatus{white-space:nowrap}
textarea,select{font:inherit}
@media (hover:none){}


@media (max-width:760px){


  #mtitle{font-size:40px}
}


/* ===== month view: Google-Calendar-like structure ===== */
@media (min-width:901px){.app{grid-template-rows:minmax(0,1fr)}.cal{min-height:0}.panel{min-height:0}}
:root:root:root{--c1:#8ea6cc;--c2:#7d86bd;--c3:#86a891;--c4:#5f8a72;--c5:#c98585;--c6:#a592c4;--c7:#d3a0b4;--c8:#a88b74}
.c6{--cc:var(--c6)}.c7{--cc:var(--c7)}.c8{--cc:var(--c8)}.c9{--cc:var(--c9)}.c10{--cc:var(--c10)}
#mtitle span{color:var(--accent)}
.wd{padding:0 0 8px}
.wd div{padding:0;text-align:center;font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted)}
.wd div.now{color:var(--accent);font-weight:600}
.grid{border:0;border-top:1px solid var(--line);grid-template-rows:repeat(var(--rows,5),minmax(0,1fr));min-height:540px}
.day{min-height:0}
.day,.day.we{background:var(--bg);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-left:0;padding:6px 4px 4px;gap:5px;align-items:stretch}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--hover)}
.day.sel{box-shadow:none;background:var(--hover)}
.num{align-self:center;width:30px;height:30px;font-size:16px;font-weight:400;color:var(--ink);border-radius:50%}
.day.out .num{color:var(--muted)}
.day.out .chip{opacity:.55}
.day.sel:not(.today) .num{box-shadow:inset 0 0 0 1.5px var(--rule)}
.day.today .num{background:var(--accent);color:#fff;font-weight:600}
.dn{top:8px;right:6px}
.chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{background:color-mix(in srgb,var(--cc) 34%,transparent);color:color-mix(in srgb,var(--cc) 38%,#fff);border-radius:4px;padding:2px 6px;font-size:12.5px;font-weight:500;line-height:1.35;gap:5px;letter-spacing:.01em}
.chip::before{display:none}
.chip b{color:inherit;font-weight:500;opacity:.85}
.chip span{text-overflow:clip}
.chip.done{background:color-mix(in srgb,var(--cc) 11%,transparent);color:color-mix(in srgb,var(--cc) 55%,var(--muted));opacity:1}
.chip.done span{text-decoration:line-through;color:inherit}
.chip .ck{flex:none;width:11px;height:11px;border:1.5px solid currentColor;border-radius:50%;position:relative;align-self:center}
.chip .ck::after{content:"";position:absolute;left:2.5px;top:1.2px;width:3px;height:5px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.more{font-size:11.5px;padding-left:4px;color:var(--muted)}
#fab{display:none}
@media (max-width:600px){
  .wd div{font-size:12px}
  .grid{grid-template-rows:repeat(var(--rows,5),minmax(104px,auto));min-height:0}
  .day,.day.we{padding:5px 2px 3px;gap:4px}
  .num{font-size:14px;width:26px;height:26px}
  .chips{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:0}
  .chip{width:auto;height:auto;border-radius:3px;padding:2px 3px;font-size:10.5px;gap:3px;background:color-mix(in srgb,var(--cc) 34%,transparent)}
  .chip.done{background:color-mix(in srgb,var(--cc) 11%,transparent)}
  .chip .ck{width:9px;height:9px;display:block}
  .chip .ck::after{left:1.8px;top:.6px;width:2.5px;height:4px}
  .chip b{display:none}
  .chip span{display:block;overflow:hidden;white-space:nowrap}

.ev .tt:focus-visible,#closePanel:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:900px){
  .app{height:auto;min-height:100%}
  .cal{height:auto;min-height:100dvh}
  .panel{left:0;right:0;top:max(8px,env(safe-area-inset-top));bottom:0;transform:none;width:auto;max-height:none;height:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
}

/* Keep every part of the day window aligned to its own padded frame. */
.panel{box-sizing:border-box;align-items:stretch}
.panel>*{width:100%;min-width:0}
.panel-head>div{flex:1;min-width:0}
.quick{align-items:stretch;width:100%;min-width:0}
#quick{box-sizing:border-box;flex:1 1 0%;width:0;min-width:0}
#addBtn{box-sizing:border-box;display:grid;place-items:center;flex:0 0 46px;width:46px;min-width:46px;height:46px;padding:0}
#qopts,#clist,.sec,#daynote{box-sizing:border-box;width:100%;min-width:0}
.day-overlay:not([hidden]){animation:dayOverlayEnter 190ms ease-out both}
.panel.is-open{animation:dayPanelEnter 240ms cubic-bezier(.2,.8,.2,1) both}
@keyframes dayOverlayEnter{from{opacity:0}to{opacity:1}}
@keyframes dayPanelEnter{from{opacity:0;transform:translate(-50%,-48%) scale(.985)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media(max-width:900px){
  .panel{left:50%;right:auto;top:max(8px,env(safe-area-inset-top));bottom:8px;transform:translateX(-50%);width:calc(100vw - 24px);height:auto;max-height:none;border-radius:24px;animation:dayPanelEnterMobile 240ms cubic-bezier(.2,.8,.2,1) both}
}
@keyframes dayPanelEnterMobile{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@media(prefers-reduced-motion:reduce){
  .day-overlay:not([hidden]),.panel.is-open{animation:none!important}
}

<script>
/* Firebase: sign-in and calendar sync. */
(() => {
  const cfg = window.FIREBASE_CONFIG;
  const acct = document.getElementById('acct'), lbl = document.getElementById('acctLbl');
  const box = document.getElementById('login'), form = document.getElementById('lgForm');
  let ready = null, current = null;
  function init() {
    if (ready) return ready;
    ready = new Promise(res => {
      if (!cfg || !window.firebase) { document.documentElement.classList.remove('locked'); res(null); return; }
      try {
        firebase.initializeApp(cfg);
        const db = firebase.firestore();
        db.enablePersistence({synchronizeTabs: true}).catch(() => {});
        let first = true;
        firebase.auth().onAuthStateChanged(u => {
          current = u;
          acct.hidden = false;
          lbl.textContent = u ? 'Аккаунт' : 'Войти';
          document.documentElement.classList.toggle('locked', !u);
          if (u) box.hidden = true; else openBox();
          if (first) { first = false; res(u ? {db, uid: u.uid} : null); }
        });
      } catch (e) { document.documentElement.classList.remove('locked'); res(null); }
    });
    return ready;
  }
  if (cfg) window.claude = {use: async name => {
    const r = await init();
    if (!r) return null;
    if (name === 'db') return {collection: p => r.db.collection(p), doc: p => r.db.doc(p)};
    if (name === 'user') return {id: async () => r.uid};
    return null;
  }};
  init();
  const $ = id => document.getElementById(id);
  function openBox() {
    $('lgErr').textContent = '';
    if (current) {
      $('lgTitle').textContent = 'Аккаунт';
      $('lgText').textContent = 'Вы вошли как ' + current.email + '. Календарь синхронизируется между устройствами.';
      $('lgEmail').hidden = $('lgPass').hidden = true;
      $('lgEmail').required = $('lgPass').required = false;
      $('lgOk').textContent = 'Выйти';
    } else {
      $('lgTitle').textContent = 'Вход';
      $('lgText').textContent = 'Войдите, чтобы открыть календарь и синхронизировать его.';
      $('lgEmail').hidden = $('lgPass').hidden = false;
      $('lgEmail').required = $('lgPass').required = true;
      $('lgOk').textContent = 'Войти';
    }
    box.hidden = false;
    if (!current) $('lgEmail').focus();
  }
  acct.onclick = openBox;
  const locked = () => document.documentElement.classList.contains('locked');
  $('lgCancel').onclick = () => { if (!locked()) box.hidden = true; };
  box.addEventListener('click', e => { if (e.target === box && !locked()) box.hidden = true; });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    $('lgOk').disabled = true;
    try {
      if (current) {
        await firebase.auth().signOut();
        try { localStorage.removeItem('quick-cal-v1'); } catch (err) {}
      } else {
        await firebase.auth().signInWithEmailAndPassword($('lgEmail').value.trim(), $('lgPass').value);
      }
      location.reload();
    } catch (err) {
      const c = (err && err.code) || '';
      $('lgErr').textContent = /invalid|wrong|not-found|credential/.test(c) ? 'Неверная почта или пароль.'
        : c.includes('network') ? 'Нет интернета. Попробуйте ещё раз, когда появится связь.'
        : c.includes('too-many') ? 'Слишком много попыток. Подождите пару минут.' : 'Не получилось войти: ' + c;
      $('lgOk').disabled = false;
    }
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
<script>
(() => {

  // light / dark switch (dark is the default)
  const tBtn = document.getElementById('appTheme'), meta = document.querySelector('meta[name=theme-color]');
  const showTheme = () => {
    const light = document.documentElement.classList.contains('light');
    document.getElementById('themeLbl2').textContent = light ? 'Тёмная тема' : 'Светлая тема';
    tBtn.setAttribute('aria-label', light ? 'Включить тёмную тему' : 'Включить светлую тему');
    meta.content = light ? '#f1f0eb' : '#111210';
  };
  tBtn.onclick = () => {
    const H = document.documentElement; H.classList.add('theming'); clearTimeout(tBtn.t); tBtn.t = setTimeout(() => H.classList.remove('theming'), 420);
    const light = H.classList.toggle('light');
    try { localStorage.setItem('my-app-theme', light ? 'light' : 'dark'); } catch (e) {}
    showTheme();
  };
  showTheme();
  // months slide in the direction you move
  const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const EASE = 'cubic-bezier(.22,.8,.24,1)';
  window.slideIn = (sel, dx) => {
    const el = document.querySelector(sel);
    if (el && el.animate && !calm()) el.animate([{opacity: .2, transform: `translateX(${dx}px)`}, {opacity: 1, transform: 'none'}], {duration: 340, easing: EASE});
  };
  [['prev', -24], ['next', 24], ['todayBtn', 0]].forEach(([id, dx]) => document.getElementById(id).addEventListener('click', () => setTimeout(() => slideIn('#grid', dx), 0)));
  // month plaques instead of ‹ Сегодня ›: a strip that keeps the open month in the middle
  const MS = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  const ymNext = ym => { let [y, m] = ym.split('-').map(Number); if (++m > 12) { m = 1; y++; } return y + '-' + String(m).padStart(2, '0'); };
  const centre = (box, smooth) => {
    const el = box.querySelector('.mp.on'); if (!el || !box.clientWidth) return;
    box.scrollTo({left: el.offsetLeft - (box.clientWidth - el.offsetWidth) / 2, behavior: smooth && !calm() ? 'smooth' : 'auto'});
  };
  window.monthPills = (box, from, to, cur, now, pick) => {
    const key = from + '|' + to + '|' + now, fresh = box.dataset.k !== key;
    if (fresh) {
      box.dataset.k = key; box.innerHTML = '';
      for (let ym = from, i = 0; ym <= to; ym = ymNext(ym), i++) {
        const [y, m] = ym.split('-'), b = document.createElement('button');
        b.type = 'button'; b.className = 'mp' + (ym === now ? ' now' : ''); b.dataset.ym = ym;
        b.innerHTML = MS[m - 1] + (m === '01' || i === 0 ? ` <small>${y}</small>` : '');
        b.title = ym === now ? 'Текущий месяц' : '';
        box.appendChild(b);
      }
      box.onclick = e => { const b = e.target.closest('.mp'); if (b) box.pick(b.dataset.ym); };
    }
    box.pick = pick;
    box.querySelectorAll('.mp').forEach(b => b.classList.toggle('on', b.dataset.ym === cur));
    centre(box, !fresh);
  };
  const recentre = () => setTimeout(() => document.querySelectorAll('.mpills').forEach(b => centre(b, false)), 30);
  addEventListener('resize', recentre); addEventListener('load', recentre);
  // flip months with the mouse wheel
  const grid = document.getElementById('grid');
  const flip = d => document.getElementById(d > 0 ? 'next' : 'prev').click();
  const canScroll = d => {
    for (let el = grid.parentElement; el && el !== document.body; el = el.parentElement) {
      const oy = getComputedStyle(el).overflowY;
      if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight + 2)
        return d > 0 ? el.scrollTop + el.clientHeight < el.scrollHeight - 2 : el.scrollTop > 2;
    }
    return false;
  };
  let acc = 0, lock = 0;
  grid.addEventListener('wheel', e => {
    if (e.ctrlKey) return;
    const horiz = Math.abs(e.deltaX) > Math.abs(e.deltaY), d = (horiz ? e.deltaX : e.deltaY) * (e.deltaMode ? 40 : 1);
    if (!d || (!horiz && canScroll(d))) return;
    e.preventDefault();
    const now = Date.now();
    if (now < lock) { lock = now + 180; return; }
    acc += d;
    if (Math.abs(acc) >= 50) { flip(acc); acc = 0; lock = now + 450; }
  }, {passive: false});
  // ...and with a finger: the month follows it, then the next one glides in
  const swipe = (el, opts) => {
    let s = null;
    el.addEventListener('touchstart', e => {
      if (e.touches.length !== 1 || (opts.ok && !opts.ok(e))) { s = null; return; }
      const t = e.touches[0]; s = {x: t.clientX, y: t.clientY, t: Date.now(), mode: 0, dx: 0};
    }, {passive: true});
    el.addEventListener('touchmove', e => {
      if (!s) return;
      const t = e.touches[0], dx = t.clientX - s.x, dy = t.clientY - s.y;
      if (!s.mode) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        s.mode = Math.abs(dx) > Math.abs(dy) * 1.2 && (!opts.dir || opts.dir(dx)) ? 1 : -1;
        if (s.mode === 1) opts.start && opts.start();
      }
      if (s.mode !== 1) return;
      e.preventDefault(); s.dx = dx; s.v = dx / Math.max(1, Date.now() - s.t); opts.move(dx);
    }, {passive: false});
    const end = () => { if (s && s.mode === 1) opts.end(s.dx, s.v || 0); s = null; };
    el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
  };
  swipe(grid, {
    move: dx => { grid.style.transform = `translateX(${dx}px)`; grid.style.opacity = 1 - Math.min(.5, Math.abs(dx) / grid.clientWidth * .6); },
    end: (dx, v) => {
      const W = grid.clientWidth, go = Math.abs(dx) > W * .22 || (Math.abs(v) > .45 && Math.abs(dx) > 40), dir = dx < 0 ? 1 : -1;
      const from = {transform: `translateX(${dx}px)`, opacity: grid.style.opacity || 1};
      grid.style.transform = grid.style.opacity = '';
      if (!go || calm()) { if (go) calShift(dir); else grid.animate([from, {transform: 'none', opacity: 1}], {duration: 260, easing: EASE}); return; }
      grid.animate([from, {transform: `translateX(${-dir * W * .5}px)`, opacity: 0}], {duration: 150, easing: 'cubic-bezier(.4,0,1,1)'}).onfinish = () => {
        calShift(dir);
        grid.animate([{transform: `translateX(${dir * W * .35}px)`, opacity: 0}, {transform: 'none', opacity: 1}], {duration: 320, easing: EASE});
      };
    }
  });
  // draggable border between the month and the day panel (computer only)
  const split = document.getElementById('split'), app = split.parentElement;
  const setPW = w => {
    const W = app.clientWidth, v = Math.round(Math.max(260, W > 900 ? Math.min(W - 420, w) : w));
    app.style.setProperty('--pw', v + 'px'); return v;
  };
  try { const w = +localStorage.getItem('my-app-pw'); if (w) setPW(w); } catch (e) {}
  const save = () => { try { localStorage.setItem('my-app-pw', parseInt(app.style.getPropertyValue('--pw'))); } catch (e) {} };
  split.addEventListener('pointerdown', e => {
    e.preventDefault(); split.setPointerCapture(e.pointerId); document.body.classList.add('dragging');
    const right = app.getBoundingClientRect().right;
    const move = ev => setPW(right - ev.clientX - 4);
    const up = () => { split.removeEventListener('pointermove', move); split.removeEventListener('pointerup', up); split.removeEventListener('pointercancel', up); document.body.classList.remove('dragging'); save(); };
    split.addEventListener('pointermove', move); split.addEventListener('pointerup', up); split.addEventListener('pointercancel', up);
  });
  split.addEventListener('dblclick', () => { app.style.removeProperty('--pw'); try { localStorage.removeItem('my-app-pw'); } catch (e) {} });
  split.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault(); e.stopPropagation();
    setPW(document.getElementById('panel').offsetWidth + (e.key === 'ArrowLeft' ? 40 : -40)); save();
  });
  addEventListener('resize', () => { const v = parseInt(app.style.getPropertyValue('--pw')); if (v) setPW(v); });
})();
</script>
<script>
(() => {
const KEY = 'quick-cal-v1';
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD_FULL = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const WD_SHORT = ['вс','пн','вт','ср','чт','пт','сб'];
const COLORS = ['c1','c2','c3','c4','c5','c6','c7','c8','c9','c10'];
const REPEAT = {'': 'Не повторять', d: 'Каждый день', w: 'Каждую неделю', m: 'Каждый месяц', y: 'Каждый год'};
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const todayS = () => ymd(new Date());
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return f[a > 10 && a < 20 ? 2 : b === 1 ? 0 : b > 1 && b < 5 ? 1 : 2]; };

let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || typeof S.items !== 'object') S = {items: {}, theme: null};

let sel = todayS();
const view = {y: new Date().getFullYear(), m: new Date().getMonth()};
let open = null, armed = null, saveT = null;

/* ---------- data ---------- */
function occurs(it, ds) {
  if (it.kind !== 'e') return false;
  if (!it.repeat) return it.date === ds;
  if (ds < it.date) return false;
  const a = parse(it.date), b = parse(ds);
  switch (it.repeat) {
    case 'd': return true;
    case 'w': return a.getDay() === b.getDay();
    case 'm': return a.getDate() === b.getDate();
    case 'y': return a.getDate() === b.getDate() && a.getMonth() === b.getMonth();
  }
  return false;
}
const isDone = (it, ds) => it.repeat ? (it.doneDates || []).includes(ds) : !!it.done;
function eventsOn(ds) {
  return Object.values(S.items).filter(it => occurs(it, ds))
    .sort((a, b) => (a.time || '').localeCompare(b.time || '') || (a.created || 0) - (b.created || 0));
}
const dayNote = ds => S.items['n' + ds];
function touch(it) { it.updated = Date.now(); dirty.add(it.id); schedule(); }
function schedule() { clearTimeout(saveT); saveT = setTimeout(persist, 400); setStatusLocal('…'); }
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch (e) { return false; } }
function persist() {
  clearTimeout(saveT); saveT = null;
  const ok = saveLocal();
  if (!sync.col) setStatus(ok ? 'Сохранено' : '⚠ Не сохранилось');
  pushRemote();
  renderGrid(); renderSub();
}
window.addEventListener('beforeunload', () => { if (saveT) persist(); });
function setStatus(t) { $('#cstatus').textContent = t; }
function setStatusLocal(t) { if (!sync.col) setStatus(t); }
function timeLabel(it) { return it.time ? it.time + (it.end ? '–' + it.end : '') : ''; }
function newEvent(fields) {
  const it = Object.assign({id: uid(), kind: 'e', date: sel, time: '', end: '', title: '', note: '', color: 'c1', repeat: '', done: false, created: Date.now()}, fields);
  S.items[it.id] = it; touch(it);
  return it;
}
function removeItem(id) { delete S.items[id]; dirty.add(id); schedule(); }

/* ---------- month grid ---------- */
const grid = $('#grid');
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}
function renderGrid() {
  $('#mtitle').innerHTML = '';
  $('#mtitle').append(MONTHS[view.m] + ' ');
  const yr = document.createElement('span'); yr.textContent = view.y; $('#mtitle').append(yr);
  const vym = view.y + '-' + String(view.m + 1).padStart(2, '0'), tn = new Date(), nym = tn.getFullYear() + '-' + String(tn.getMonth() + 1).padStart(2, '0');

  [...document.querySelectorAll('#wd div')].forEach((el, k) => el.classList.toggle('now', curM && k === tw));
  for (let i = 0; i < rows * 7; i++) {
    const d = new Date(view.y, view.m, 1 - off + i), ds = ymd(d);

    c.className = 'day' + (d.getMonth() !== view.m ? ' out' : '') + (ds === t ? ' today' : '') + (ds === sel ? ' sel' : '') + (i % 7 > 4 ? ' we' : '');

}

/* ---------- day panel ---------- */
function relDay(ds) {

  if (diff === 0) return 'сегодня';

  return diff > 0 ? `через ${diff} ${plural(diff, ['день', 'дня', 'дней'])}` : `${-diff} ${plural(diff, ['день', 'дня', 'дней'])} назад`;
}
function renderSub() {

function toggleDone(it) {

function editorEl(it) {

  const q = s => ed.querySelector(s);

  const rep = q('.f-rep');

/* quick add */
function parseQuick(s) {
  s = s.trim();
  const m = s.match(/^(\d{1,2})[:.](\d{2})(?:\s*[-–—]\s*(\d{1,2})[:.](\d{2}))?\s*(.*)$/);
  if (m && +m[1] < 24 && +m[2] < 60) {
    const f = {time: pad(+m[1]) + ':' + m[2], title: m[5]};
    if (m[3] && +m[3] < 24 && +m[4] < 60) f.end = pad(+m[3]) + ':' + m[4];
    return f;
  }
  return {title: s};
}
let qColor = 'c1';
try { const c = localStorage.getItem('my-app-qcolor'); if (COLORS.includes(c)) qColor = c; } catch (e) {}
const qAll = $('#qall'), qTime = $('#qtime');
function renderQcol() {

  COLORS.forEach((c, i) => {

    b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', c === qColor); b.setAttribute('aria-label', 'Цвет ' + (i + 1));
    b.onclick = () => { qColor = c; try { localStorage.setItem('my-app-qcolor', c); } catch (e) {} renderQcol(); };

}

}

// fields for a new item: typed "15:30 …" wins, otherwise the picked time; colour from the picker
function quickFields() {
  const v = $('#quick').value.trim();
  const f = Object.assign({color: qColor}, v ? parseQuick(v) : {});
  if (!f.time && !qAll.classList.contains('on') && $('#qfrom').value) {

['#qfrom', '#qto'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter' && $('#quick').value.trim()) { e.preventDefault(); $('#quick').dispatchEvent(new KeyboardEvent('keydown', {key: 'Enter'})); } }));

/* day note */
$('#daynote').addEventListener('input', e => {

  const id = 'n' + sel, text = e.target.value;
  let it = S.items[id];
  if (!text.trim()) { if (it) removeItem(id); return; }

/* keyboard */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#panel').classList.contains('is-open')) { closeDayPanel(); return; }
  const a = document.activeElement;
  if (a && (a.matches('input, textarea, select') || a.isContentEditable)) {
    if (e.key === 'Escape') { a.blur(); if (open) { closeEditor(); renderList(); renderGrid(); } }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowLeft') select(addDays(sel, -1));
  else if (k === 'ArrowRight') select(addDays(sel, 1));
  else if (k === 'ArrowUp') select(addDays(sel, -7));
  else if (k === 'ArrowDown') select(addDays(sel, 7));
  else if (k === 'PageUp') shiftMonth(-1);
  else if (k === 'PageDown') shiftMonth(1);
  else if (k === 't' || k === 'T' || k === 'е' || k === 'Е') select(todayS());
  else if (k === 'n' || k === 'N' || k === 'т' || k === 'Т') { $('#quick').focus(); }
  else return;
  e.preventDefault();
});

/* theme */
function applyTheme() {}

/* ---------- sync between devices (when opened on claude.ai) ---------- */
const dirty = new Set();
const sync = {col: null, busy: new Set(), again: new Set(), err: '', wait: 0, timer: 0, first: false, unsub: null, pending: false};
function syncLabel() {
  if (!sync.col) return;
  if (sync.err) setStatus('⚠ Не синхронизируется: ' + sync.err);
  else setStatus(dirty.size || sync.busy.size || saveT ? 'Синхронизация…' : 'Синхронизировано ☁');
}
function retryLater() {
  clearTimeout(sync.timer);
  sync.wait = Math.min(30000, (sync.wait || 1000) * 2);
  sync.timer = setTimeout(pushRemote, sync.wait);
}
function pushRemote() {
  if (!sync.col) return;
  [...dirty].forEach(id => {
    dirty.delete(id);
    if (sync.busy.has(id)) { sync.again.add(id); return; }
    const it = S.items[id];
    sync.busy.add(id);
    const p = it ? sync.col.doc(id).set(JSON.parse(JSON.stringify(it))) : sync.col.doc(id).delete();
    p.then(() => { sync.err = ''; sync.wait = 0; })
      .catch(e => { dirty.add(id); sync.err = (e && e.code) || 'ошибка'; retryLater(); })
      .finally(() => {
        sync.busy.delete(id);
        if (sync.again.delete(id)) dirty.add(id);
        if (dirty.size && !sync.err) setTimeout(pushRemote, 800);
        syncLabel();
      });
  });
  syncLabel();
}
const editing = () => { const a = document.activeElement; return !!a && (a.id === 'daynote' || !!a.closest('.editor')); };
function applyRemote(snap, full) {
  let changed = false;
  const seen = new Set();
  snap.docs.forEach(d => {
    seen.add(d.id);
    if (d.metadata && d.metadata.hasPendingWrites) return;
    const v = d.data();
    if (!v || !v.kind || dirty.has(d.id) || sync.busy.has(d.id)) return;
    const l = S.items[d.id];
    if (l && l.updated === v.updated) return;
    // first load: an edit made here that never reached the cloud wins if it is newer
    if (l && !sync.first && (l.updated || 0) > (v.updated || 0)) { dirty.add(d.id); return; }
    S.items[d.id] = Object.assign({}, v, {id: d.id});
    changed = true;
  });
  if (!sync.first || full) {
    const firstRun = !sync.first;
    sync.first = true;
    Object.keys(S.items).forEach(id => {
      if (seen.has(id) || dirty.has(id) || sync.busy.has(id)) return;
      if (firstRun) { dirty.add(id); return; }      // this device's items the cloud doesn't have yet
      delete S.items[id]; changed = true;            // deleted on another device
    });
  } else if (snap.docChanges) {
    snap.docChanges().forEach(c => {
      const id = c.doc.id;
      if (c.type === 'removed' && S.items[id] && !dirty.has(id) && !sync.busy.has(id)) { delete S.items[id]; changed = true; }
    });
  }
  if (changed) {
    saveLocal();
    if (open && !S.items[open]) open = null;
    if (editing()) sync.pending = true; else renderAll();
  }
  pushRemote();
}
document.addEventListener('focusout', () => setTimeout(() => {
  if (sync.pending && !editing()) { sync.pending = false; renderAll(); }
}, 50));
function subscribe() {
  if (sync.unsub) try { sync.unsub(); } catch (e) {}
  sync.unsub = sync.col.onSnapshot(snap => { if (sync.err === 'нет связи') sync.err = ''; applyRemote(snap); syncLabel(); }, e => {
    const code = (e && e.code) || '';
    if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled') { sync.err = 'нет доступа'; syncLabel(); return; }
    sync.err = 'нет связи'; syncLabel();
    setTimeout(subscribe, 3000);
  });
}
function refresh() {
  if (!sync.col) return;
  sync.col.get().then(snap => { applyRemote(snap, true); syncLabel(); }).catch(() => {});
  if (dirty.size) pushRemote();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { refresh(); renderGrid(); } });
window.addEventListener('focus', refresh);
async function startSync() {
  if (!window.claude || !claude.use) { setStatus('Только в этом браузере'); return; }
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = db && user && await user.id();
    if (!id) { setStatus('⚠ Только на этом устройстве (нажмите «Войти»)'); return; }
    sync.col = db.collection('data/users/' + id).doc('calendar').collection('items');
    setStatus('Подключаюсь…');
    subscribe();
  } catch (e) { setStatus('⚠ Синхронизация недоступна'); }
}

renderAll();
startSync();
})();
